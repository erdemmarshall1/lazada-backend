name: Deploy

on:
  push:
    branches: [master, admin]

jobs:
  deploy-backend:
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        run: echo "Render auto-deploys from render.yaml on push to master"

  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          # TODO: Replace with Render URL after first deploy
          VITE_API_BASE_URL: https://supportive-delight-production-b90c.up.railway.app
          VITE_SOCKET_URL: https://supportive-delight-production-b90c.up.railway.app

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=theoutnet-wholesale --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
